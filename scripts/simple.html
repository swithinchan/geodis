<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>geodis</title>
<style>
body{font-family:Arial,sans-serif;background:#111;color:#ddd;margin:20px}
h1{color:#f0729a}
.card{background:#1a1a2e;border-radius:8px;padding:12px;margin:8px 0;border:1px solid #333}
.card h3{color:#f0729a;margin:0 0 4px}
.addr{font-size:12px;color:#888}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{text-align:left;padding:4px 8px;background:#222;color:#f0729a}
td{padding:3px 8px;border-bottom:1px solid #222}
.cost{color:#4ade80;font-weight:bold}
.loading{color:#888;font-size:14px}
.error{color:#f87171;background:#3b1018;padding:12px;border-radius:6px}
</style>
</head>
<body>
<h1>geodis — Fieldwork Assignments</h1>
<div id="content" class="loading">Loading data from routes.geojson...</div>

<script>
async function init(){
  try{
    const resp=await fetch('routes.geojson');
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const feats=data.features||[];
    
    const officers=feats.filter(f=>f.properties?.featureType==='officer');
    const sites=feats.filter(f=>f.properties?.featureType==='site');
    const routes=feats.filter(f=>f.properties?.featureType==='full-route');
    
    // Group by officer
    const byOff={};
    for(const r of routes){
      const on=r.properties.officer;
      if(!byOff[on])byOff[on]=[];
      byOff[on].push(r);
    }
    for(const on in byOff)byOff[on].sort((a,b)=>a.properties.walking_cost-b.properties.walking_cost);
    
    const totCost=routes.reduce((s,r)=>s+(r.properties.walking_cost||0),0);
    let html=`<p>${officers.length} officers · ${sites.length} fieldwork sites · ${routes.length} walking routes · ${(totCost/1000).toFixed(1)}km total walking</p>`;
    
    for(const on of Object.keys(byOff).sort()){
      const rs=byOff[on];
      const tot=rs.reduce((s,r)=>s+(r.properties.walking_cost||0),0);
      const off=officers.find(o=>o.properties.name===on);
      const addr=off?off.properties.address:'?';
      
      html+=`<div class="card"><h3>${on}</h3><div class="addr">Home: ${addr}</div><div class="addr">${rs.length} sites · ${tot.toFixed(0)}m total walking</div><table><tr><th>#</th><th>Site</th><th>Address</th><th>Walk</th><th>Straight</th><th>Pts</th></tr>`;
      
      rs.forEach((r,i)=>{
        const p=r.properties;
        html+=`<tr><td>${i+1}</td><td><b>${p.site}</b></td><td style="font-size:10px;color:#888">${p.site_address||''}</td><td class="cost">${(p.walking_cost||0).toFixed(0)}m</td><td>${(p.straight_line||0).toFixed(0)}m</td><td>${p.waypoint_count||'?'}</td></tr>`;
      });
      
      html+='</table></div>';
    }
    
    document.getElementById('content').innerHTML=html;
  }catch(e){
    document.getElementById('content').innerHTML=`<div class="error">Error: ${e.message}<br><br>Make sure the server is running and routes.geojson is accessible.</div>`;
  }
}
init();
</script>
</body>
</html>
